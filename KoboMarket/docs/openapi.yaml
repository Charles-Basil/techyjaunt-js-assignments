openapi: 3.0.3
info:
  title: KoboMarket API
  version: 1.0.0
  description: |
    Multi-vendor marketplace with wallets, a double-entry ledger and escrow.
    All money amounts are integers in kobo (100 kobo = 1 NGN).

    **Auth flow:** register -> verify email (token from the email link) -> login ->
    send `Authorization: Bearer <accessToken>`. When the access token expires (15 min),
    call `/auth/refresh` with the refresh token to get a NEW pair. Each refresh token
    works once; reusing an old one logs the user out everywhere.
servers:
  - url: http://localhost:3000
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Vendors
  - name: Admin
  - name: Products
  - name: Reviews
  - name: Cart
  - name: Wallet
  - name: Orders
    description: |
      Checkout pays from the wallet into ESCROW. Each vendor's part of an order is a
      sub-order with its own status:

      ```
      PENDING_PAYMENT ─> PAID ─┬─> SHIPPED ─┬─> DELIVERED ─┬─> COMPLETED   (escrow released to vendor)
                               │            │              └─> DISPUTED
                               │            ├─> COMPLETED
                               │            └─> DISPUTED ─┬─> COMPLETED
                               └─> CANCELLED              └─> REFUNDED
      ```
      COMPLETED, CANCELLED and REFUNDED are final. Sub-orders are created directly in PAID
      (the wallet pays instantly) with a PENDING_PAYMENT -> PAID event in their history.
  - name: Fulfilment
  - name: Disputes
    description: |
      A buyer disputes a SHIPPED/DELIVERED sub-order; its escrow stays frozen (no auto-complete)
      until an ADMIN resolves it with FULL_REFUND, PARTIAL_REFUND or REJECTED.
  - name: Payouts
    description: |
      Vendors withdraw wallet money to their bank. The amount leaves the wallet immediately
      (into payout clearing); a background job sends the transfer. If the transfer fails,
      the money goes back to the wallet.
  - name: Webhooks
  - name: Mock Paystack
    description: Fake payment provider. Only available when PAYSTACK_MODE=mock and NODE_ENV is not production.
  - name: RBAC test

paths:
  /health:
    get:
      summary: Check that the API, MongoDB and PostgreSQL are up
      tags: [System]
      responses:
        '200':
          description: Both databases are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: At least one database is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /api/v1/auth/register:
    post:
      summary: Create an account (sends a verification email)
      description: |
        Creates the user with role BUYER and a wallet in Postgres. No tokens are returned:
        the user must verify their email first. Unknown fields (e.g. `roles`) are rejected.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: ada@example.com
              password: Password123
              firstName: Ada
              lastName: Obi
              phone: '+2348012345678'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example:
                success: true
                data:
                  user:
                    id: 674a1f0c2b9e4c0012ab34cd
                    email: ada@example.com
                    firstName: Ada
                    lastName: Obi
                    phone: '+2348012345678'
                    roles: [BUYER]
                    isEmailVerified: false
                    status: ACTIVE
                    walletStatus: CREATED
                    createdAt: '2026-11-21T10:00:00.000Z'
                    updatedAt: '2026-11-21T10:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: EMAIL_TAKEN, message: An account with this email already exists, details: null }

  /api/v1/auth/verify-email:
    post:
      summary: Verify an email address with the token from the email link
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
            example:
              token: 3f9c2a...e81b
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400':
          description: Token invalid, already used, or expired (24h)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: INVALID_TOKEN, message: Verification link is invalid or has expired, details: null }

  /api/v1/auth/login:
    post:
      summary: Log in and get an access + refresh token
      description: Rate limited to 5 failed attempts per 15 minutes per email + IP.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: ada@example.com
              password: Password123
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: INVALID_CREDENTIALS, message: Email or password is incorrect, details: null }
        '403':
          description: Email not verified (EMAIL_NOT_VERIFIED) or account frozen (ACCOUNT_FROZEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: EMAIL_NOT_VERIFIED, message: Please verify your email before logging in, details: null }
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: TOO_MANY_ATTEMPTS, message: Too many failed login attempts. Try again later., details: null }

  /api/v1/auth/refresh:
    post:
      summary: Swap a refresh token for a new access + refresh token (rotation)
      description: |
        The refresh token you send is revoked and a new one is returned. If a refresh token
        that was already used is sent again, all of the user's sessions are revoked
        (TOKEN_REUSE_DETECTED) because the token was probably stolen.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: INVALID_REFRESH_TOKEN (unknown/expired) or TOKEN_REUSE_DETECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: TOKEN_REUSE_DETECTED, message: 'Session is no longer valid, please log in again', details: null }
        '403':
          description: Account frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      description: Always returns 200, whether or not the token existed.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example:
                success: true
                data: { message: Logged out }

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      description: Always returns 200 so the response doesn't reveal whether the email is registered.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example:
              email: ada@example.com
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example:
                success: true
                data: { message: 'If an account exists for this email, a reset link has been sent' }

  /api/v1/auth/reset-password:
    post:
      summary: Set a new password using the token from the reset email
      description: Also logs the user out on every device (all refresh tokens are revoked).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
            example:
              token: 9b1d4e...07aa
              newPassword: NewPassword456
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Token invalid or expired (30 min), or the new password is too weak
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/users/me:
    get:
      summary: Get the logged-in user
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update your own profile
      description: Only firstName, lastName and phone can be changed. Any other field returns 400.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                firstName: { type: string, maxLength: 50 }
                lastName: { type: string, maxLength: 50 }
                phone: { type: string, example: '+2348012345678' }
            example:
              firstName: Chioma
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/vendors/apply:
    post:
      summary: Apply to become a vendor
      description: |
        One application per user. 409 if you already have a PENDING or APPROVED one.
        After a REJECTED decision you may apply again. Frozen accounts get 403.
        The account number is always masked in responses.
      tags: [Vendors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorApplyRequest' }
            example:
              storeName: Ada Shoes
              description: Handmade leather shoes
              bankDetails: { bankName: GTBank, bankCode: '058', accountNumber: '0123456789', accountName: Ada Obi }
      responses:
        '201':
          description: Application submitted (status PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorApplicationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: APPLICATION_EXISTS or STORE_NAME_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: APPLICATION_EXISTS, message: You already have a PENDING vendor application, details: null }

  /api/v1/vendors/{id}:
    get:
      summary: Public store info for an approved vendor
      description: "`id` is the vendor's user id (the same value as `vendorId` on products). No bank details."
      tags: [Vendors]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Store info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      vendor: { $ref: '#/components/schemas/PublicVendor' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/vendors:
    get:
      summary: List vendor applications (ADMIN)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of applications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VendorApplication' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/vendors/{id}/approve:
    patch:
      summary: Approve or reject a vendor application (ADMIN)
      description: |
        `id` is the application id. Only PENDING applications can be decided.
        APPROVED adds the VENDOR role to the user. A reason is required when rejecting.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, maxLength: 500 }
            examples:
              approve: { value: { decision: APPROVED } }
              reject: { value: { decision: REJECTED, reason: Bank account name does not match } }
      responses:
        '200':
          description: Decision saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorApplicationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: APPLICATION_ALREADY_DECIDED, message: Application is already APPROVED, details: null }

  /api/v1/products:
    get:
      summary: List and search products (public, cursor paginated)
      description: |
        Only active, non-deleted products. Pass `pagination.nextCursor` back as `cursor`
        (with the same filters and sort) to get the next page. Price filters use the base price.
      tags: [Products]
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Full-text search on name and description }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: vendorId, schema: { type: string } }
        - { in: query, name: minPrice, schema: { type: integer, minimum: 0 }, description: In kobo }
        - { in: query, name: maxPrice, schema: { type: integer, minimum: 0 }, description: In kobo }
        - { in: query, name: minRating, schema: { type: number, minimum: 0, maximum: 5 } }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, price_asc, price_desc, rating], default: newest }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          description: Bad query value (VALIDATION_ERROR) or bad cursor (INVALID_CURSOR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Create a product (VENDOR with an APPROVED profile)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
            example:
              name: Leather Boot
              description: Handmade
              priceKobo: 2500000
              category: shoes
              stock: 0
              images: ['https://example.com/boot.jpg']
              tags: [leather]
              variants:
                - { name: Size 42, sku: BOOT-42, attributes: { size: '42', colour: brown }, priceKobo: 2500000, stock: 4 }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a vendor (FORBIDDEN) or profile not approved (VENDOR_NOT_APPROVED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/products/{slug}:
    get:
      summary: Get one product by slug (public)
      tags: [Products]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string }, example: leather-boot-4f9a1c }
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404':
          description: Not found, deleted or inactive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/products/{id}:
    patch:
      summary: Update your own product (VENDOR, owner only)
      description: vendorId, slug, ratingAvg, ratingCount and isDeleted cannot be changed (400).
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
            example:
              priceKobo: 2200000
              stock: 7
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a vendor (FORBIDDEN) or not your product (NOT_PRODUCT_OWNER)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete your own product (VENDOR, owner only)
      description: Sets isDeleted true, isActive false and deletedAt. The product disappears from listings.
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products/{id}/reviews:
    get:
      summary: List a product's reviews (public, newest first, cursor paginated)
      tags: [Reviews]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Review a product you have received
      description: Requires a COMPLETED sub-order containing this product. One review per buyer per product.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
            example:
              rating: 5
              comment: Fits perfectly
      responses:
        '201':
          description: Review created; the product's ratingAvg and ratingCount are updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      review: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No completed purchase of this product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: NOT_ELIGIBLE_TO_REVIEW, message: You can only review products you have received, details: null }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: ALREADY_REVIEWED, message: You have already reviewed this product, details: null }

  /api/v1/cart:
    get:
      summary: Get your cart with CURRENT prices and stock
      description: |
        Each item has flags: `priceChanged` (current price differs from when you added it),
        `outOfStock` (current stock is below your quantity) and `unavailable` (product deleted,
        hidden, or variant removed). `subtotalKobo` uses current prices; unavailable items count as 0.
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Your cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cart/items:
    post:
      summary: Add a product to your cart
      description: |
        If the same product + variant is already in the cart, the quantities are added together.
        The total may not exceed current stock (409 INSUFFICIENT_STOCK) or 100.
        Products that have variants require `variantId` (400 VARIANT_REQUIRED).
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                variantId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 100 }
            example:
              productId: 674a1f0c2b9e4c0012ab34cd
              quantity: 2
      responses:
        '201':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: PRODUCT_UNAVAILABLE or VARIANT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Not enough stock (INSUFFICIENT_STOCK) or the cart changed meanwhile (CART_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: INSUFFICIENT_STOCK, message: Not enough stock for this quantity, details: { available: 5, requested: 6 } }

  /api/v1/cart/items/{itemId}:
    patch:
      summary: Change the quantity of a cart item
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 100 }
            example:
              quantity: 3
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: CART_ITEM_NOT_FOUND or PRODUCT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Not enough stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Remove an item from your cart
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: CART_ITEM_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallet:
    get:
      summary: Your wallet balance
      description: Creates the wallet first if it is somehow missing. balanceKobo is whole kobo (100 kobo = NGN 1).
      tags: [Wallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Your wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/wallet/transactions:
    get:
      summary: Your wallet's ledger entries, newest first (cursor paginated)
      tags: [Wallet]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WalletEntry' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          description: Bad limit (VALIDATION_ERROR) or cursor (INVALID_CURSOR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/wallet/fund:
    post:
      summary: Start adding money to your wallet
      description: |
        Creates a PENDING funding and returns the payment page URL. **No money moves yet.**
        The wallet is credited only when the verified `charge.success` webhook arrives.
        Requires an `Idempotency-Key`: retrying with the same key and body returns the
        stored response (header `Idempotent-Replayed: true`) instead of creating a second funding.
      tags: [Wallet]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountKobo]
              properties:
                amountKobo:
                  type: integer
                  minimum: 10000
                  maximum: 100000000
                  description: NGN 100 to NGN 1,000,000, in kobo
            example:
              amountKobo: 250000
      responses:
        '201':
          description: Funding started
          headers:
            Idempotent-Replayed:
              description: '"true" when this is a stored response for a repeated request'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/FundingStarted' }
        '400':
          description: IDEMPOTENCY_KEY_REQUIRED, INVALID_IDEMPOTENCY_KEY or VALIDATION_ERROR (stored and replayed like any answer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: IDEMPOTENCY_KEY_REQUIRED, message: The Idempotency-Key header is required, details: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: IDEMPOTENCY_KEY_REUSED (same key, different body) or REQUEST_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: IDEMPOTENCY_KEY_REUSED, message: This Idempotency-Key was already used with a different request, details: null }
        '502':
          description: The payment provider could not start the payment. Not stored, so you may retry with the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallet/fundings/{reference}:
    get:
      summary: Status of one of your fundings
      description: Someone else's reference returns 404.
      tags: [Wallet]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string }, example: FUND_3b8f0c1e-2a4d-4c55-9f1e-1c2d3e4f5a6b }
      responses:
        '200':
          description: The funding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Funding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: FUNDING_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/orders/checkout:
    post:
      summary: Place an order paid from your wallet (money goes into escrow)
      description: |
        Send `{}` to check out your **cart** (bought lines are removed from it), or
        `{ "items": [...] }` to **buy now** without touching the cart. Prices are always the
        CURRENT product prices. One sub-order is created per vendor, in status PAID.
        The vendor is paid only when the buyer confirms, or automatically 72h after shipping.

        Requires an `Idempotency-Key`: a retry with the same key and body returns the stored
        response (header `Idempotent-Replayed: true`) and never creates a second order.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      variantId: { type: string }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
            examples:
              cart: { summary: Check out my cart, value: {} }
              buyNow: { summary: Buy now, value: { items: [{ productId: 674a1f0c2b9e4c0012ab34cd, quantity: 2 }] } }
      responses:
        '201':
          description: Order placed and paid; stock reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400':
          description: VALIDATION_ERROR, CART_EMPTY, CANNOT_BUY_OWN_PRODUCT or IDEMPOTENCY_KEY_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Wallet balance too low. Nothing is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: INSUFFICIENT_FUNDS, message: Your wallet balance is too low for this order, details: { balanceKobo: 50000, requiredKobo: 100000 } }
        '403':
          description: Account frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            CART_INVALID (unavailable / not enough stock, listed in details), OUT_OF_STOCK
            (sold out during checkout; you were refunded), IDEMPOTENCY_KEY_REUSED or REQUEST_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error:
                  code: OUT_OF_STOCK
                  message: An item sold out while you were checking out; you have not been charged
                  details: { orderId: 3f1c2b8e-0a4d-4c55-9f1e-1c2d3e4f5a6b, productId: 674a1f0c2b9e4c0012ab34cd, variantId: null, name: Red Sneakers, requested: 1 }
        '503':
          description: STOCK_UPDATE_FAILED (MongoDB unavailable). Refunded; safe to retry with the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/orders:
    get:
      summary: Your orders, newest first (cursor paginated)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [IN_PROGRESS, COMPLETED, CANCELLED, REFUNDED] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of orders (with sub-orders and items)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/orders/{orderId}:
    get:
      summary: One order with sub-orders, items and status history
      description: Visible to the buyer who placed it and to ADMINs. Anyone else gets 404.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrderIdPath' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{orderId}/cancel:
    post:
      summary: Cancel your order before anything has shipped
      description: |
        Allowed only while every non-cancelled sub-order is PAID. Refunds escrow to your wallet
        in one transaction and puts the stock back.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrderIdPath' }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
            example: {}
      responses:
        '200':
          description: Cancelled and refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ORDER_NOT_CANCELLABLE (something already shipped, or already cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/vendor/sub-orders:
    get:
      summary: The sub-orders you have to fulfil (VENDOR), newest first
      tags: [Fulfilment]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING_PAYMENT, PAID, SHIPPED, DELIVERED, COMPLETED, CANCELLED, DISPUTED, REFUNDED] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of your sub-orders with items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubOrder' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/sub-orders/{subOrderId}/ship:
    patch:
      summary: Mark your sub-order as shipped (VENDOR, owner) - PAID -> SHIPPED
      description: Starts the escrow timeout. Without a confirmation or dispute, it auto-completes 72h after shipped_at.
      tags: [Fulfilment]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/SubOrderIdPath' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trackingNumber: { type: string, maxLength: 100 }
            example:
              trackingNumber: GIG-1234567
      responses:
        '200': { $ref: '#/components/responses/SubOrderOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a vendor (FORBIDDEN) or another vendor's sub-order (NOT_SUB_ORDER_OWNER)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/sub-orders/{subOrderId}/deliver:
    patch:
      summary: Mark your sub-order as delivered (VENDOR, owner) - SHIPPED -> DELIVERED
      description: The courier delivered it. The buyer can still confirm or dispute.
      tags: [Fulfilment]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/SubOrderIdPath' }
      responses:
        '200': { $ref: '#/components/responses/SubOrderOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN or NOT_SUB_ORDER_OWNER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/sub-orders/{subOrderId}/confirm:
    patch:
      summary: Confirm you received it (buyer) - releases escrow to the vendor
      description: |
        SHIPPED or DELIVERED -> COMPLETED, in one transaction with the payout:
        DEBIT escrow subtotal, CREDIT vendor wallet (subtotal - commission), CREDIT platform
        revenue (commission, using the rate stored on the sub-order at checkout).
        A sub-order can never be released twice.
      tags: [Fulfilment]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/SubOrderIdPath' }
      responses:
        '200': { $ref: '#/components/responses/SubOrderOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /api/v1/sub-orders/{subOrderId}/disputes:
    post:
      summary: Open a dispute on a sub-order you bought (SHIPPED or DELIVERED only)
      description: The sub-order becomes DISPUTED and its escrow is frozen until an admin resolves it.
      tags: [Disputes]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/SubOrderIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
                evidence:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/Evidence' }
            example:
              reason: The sandals arrived with a broken strap
              evidence:
                - { type: text, value: Strap came off on first use }
                - { type: image, value: 'https://images.example.com/strap.jpg' }
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: DISPUTE_ALREADY_OPEN, or INVALID_STATE_TRANSITION (e.g. not shipped yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: DISPUTE_ALREADY_OPEN, message: There is already an open dispute for this sub-order, details: null }

  /api/v1/disputes:
    get:
      summary: List disputes (ADMIN), newest first
      tags: [Disputes]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, RESOLVED] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of disputes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/disputes/{disputeId}:
    get:
      summary: One dispute (ADMIN, the buyer, or the vendor of that sub-order)
      tags: [Disputes]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/DisputeIdPath' }
      responses:
        '200':
          description: The dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/disputes/{disputeId}/resolve:
    patch:
      summary: Resolve a dispute (ADMIN) and settle its escrow
      description: |
        One transaction, one balanced ledger transaction (reference `DISPUTE_RESOLUTION:<disputeId>`,
        unique, so a dispute can never be resolved twice):

        - **FULL_REFUND**: escrow -> buyer (whole subtotal). Sub-order REFUNDED.
        - **PARTIAL_REFUND**: escrow -> buyer `refundKobo` (0 < refundKobo < subtotal); the vendor gets
          the rest minus commission, and commission is charged on the vendor's part only.
          Example: subtotal 100000, refund 40000, 500 bps -> buyer 40000, vendor 57000, revenue 3000.
          Sub-order COMPLETED.
        - **REJECTED**: normal release (vendor 95%, revenue 5% at 500 bps). Sub-order COMPLETED.
      tags: [Disputes]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/DisputeIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution, note]
              properties:
                resolution: { type: string, enum: [FULL_REFUND, PARTIAL_REFUND, REJECTED] }
                refundKobo: { type: integer, minimum: 1, description: Required for PARTIAL_REFUND only }
                note: { type: string, minLength: 5, maxLength: 1000 }
            examples:
              full: { value: { resolution: FULL_REFUND, note: Item damaged in transit } }
              partial: { value: { resolution: PARTIAL_REFUND, refundKobo: 40000, note: One strap broken } }
              rejected: { value: { resolution: REJECTED, note: Photos show normal wear } }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeResponse' }
        '400':
          description: VALIDATION_ERROR or INVALID_REFUND_AMOUNT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: DISPUTE_ALREADY_RESOLVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/payouts:
    post:
      summary: Request a payout to your bank account (VENDOR)
      description: |
        Requires an APPROVED vendor profile with bank details. The amount leaves your wallet
        immediately (into payout clearing), so it can't be spent or withdrawn twice. At most one
        PENDING/PROCESSING payout per vendor. Requires an `Idempotency-Key`.
      tags: [Payouts]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountKobo]
              properties:
                amountKobo: { type: integer, minimum: 100000, description: 'At least PAYOUT_MIN_KOBO (NGN 1,000)' }
            example:
              amountKobo: 300000
      responses:
        '201':
          description: Payout requested (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Balance too low
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN (not a vendor), VENDOR_NOT_APPROVED or ACCOUNT_FROZEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: PAYOUT_ALREADY_PENDING, IDEMPOTENCY_KEY_REUSED or REQUEST_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: PAYOUT_ALREADY_PENDING, message: You already have a payout in progress, details: null }
    get:
      summary: Your payouts (VENDOR), newest first
      tags: [Payouts]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, PROCESSING, SUCCESS, FAILED] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payout' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/payouts/{payoutId}:
    get:
      summary: One payout (the owning vendor or ADMIN)
      tags: [Payouts]
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/PayoutIdPath' }
      responses:
        '200':
          description: The payout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/webhooks/paystack:
    post:
      summary: Paystack webhook receiver (called by Paystack, not by apps)
      description: |
        Authenticated by the `x-paystack-signature` header: HMAC-SHA512 (hex) of the raw request
        body, keyed with the Paystack secret key. Every request is recorded in webhook_events.
        For `charge.success` the payment is re-verified with Paystack (status, currency, amount)
        before the wallet is credited, and it is credited exactly once however many times the
        event is delivered. `transfer.success` / `transfer.failed` / `transfer.reversed` (vendor
        payouts, reference = payout id) are re-verified too, then settle or reverse the payout once. Every validly signed event gets 200 so Paystack stops retrying.
        A 500 (e.g. Paystack unreachable during verification) makes Paystack retry later.
        Not behind the API rate limiter.
      tags: [Webhooks]
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaystackEvent' }
      responses:
        '200':
          description: Received (credited, already processed, ignored, or not verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
        '401':
          description: Missing or invalid signature. Nothing is processed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: INVALID_SIGNATURE, message: Invalid webhook signature, details: null }

  /mock-paystack/checkout/{reference}:
    get:
      summary: The mock "payment page" for a funding (authorizationUrl points here)
      tags: [Mock Paystack]
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string } }
      responses:
        '200':
          description: Mock transaction details and how to pay
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      reference: { type: string }
                      amountKobo: { type: integer }
                      email: { type: string }
                      status: { type: string, enum: [pending, success, failed] }
                      howToPay: { type: string }
        '404':
          description: MOCK_TRANSACTION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mock-paystack/checkout/{reference}/pay:
    post:
      summary: Simulate the buyer paying (or failing), then send signed webhook(s)
      description: |
        Marks the mock payment, then POSTs the `charge.success` (or `charge.failed`) webhook to
        WEBHOOK_TARGET_URL `duplicates` times, signed exactly like Paystack. Use duplicates > 1
        to see that the wallet is still credited once. A payment's outcome can't change later.
      tags: [Mock Paystack]
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, enum: [success, failed], default: success }
                duplicates: { type: integer, minimum: 1, maximum: 5, default: 2 }
            example:
              outcome: success
              duplicates: 3
      responses:
        '200':
          description: What each webhook delivery got back
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      reference: { type: string }
                      outcome: { type: string }
                      deliveries:
                        type: array
                        items:
                          type: object
                          properties:
                            attempt: { type: integer }
                            status: { type: integer, nullable: true }
                            body: { type: object, nullable: true }
                            error: { type: string }
              example:
                success: true
                data:
                  reference: FUND_3b8f0c1e-2a4d-4c55-9f1e-1c2d3e4f5a6b
                  outcome: success
                  deliveries:
                    - { attempt: 1, status: 200, body: { received: true } }
                    - { attempt: 2, status: 200, body: { received: true } }
                    - { attempt: 3, status: 200, body: { received: true } }
        '404':
          description: MOCK_TRANSACTION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: MOCK_ALREADY_PAID (trying to change the outcome)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/admin/ping:
    get:
      summary: RBAC test route (ADMIN only)
      tags: [RBAC test]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: You are an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example:
                success: true
                data: { message: pong (admin) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/vendor/ping:
    get:
      summary: RBAC test route (VENDOR only)
      tags: [RBAC test]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: You are a vendor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example:
                success: true
                data: { message: pong (vendor) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      in: query
      name: cursor
      description: The `nextCursor` value from the previous page
      schema: { type: string }
    OrderIdPath:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    SubOrderIdPath:
      in: path
      name: subOrderId
      required: true
      schema: { type: string, format: uuid }
    DisputeIdPath:
      in: path
      name: disputeId
      required: true
      schema: { type: string, format: uuid }
    PayoutIdPath:
      in: path
      name: payoutId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        A unique value per action (generate one per button click, reuse it only for retries).
        8-100 characters: letters, digits, - and _. Scoped per user and endpoint.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
      example: fund_2f1c9a7e-6b4d-4f0a-8c3e-91d2b7a5e004

  responses:
    SubOrderOk:
      description: The updated sub-order
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                properties:
                  subOrder: { $ref: '#/components/schemas/SubOrder' }
    InvalidTransition:
      description: The sub-order's current status does not allow this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: INVALID_STATE_TRANSITION
              message: Cannot complete a sub-order that is PAID
              details: { from: PAID, to: COMPLETED, allowed: [SHIPPED, CANCELLED] }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: NOT_FOUND, message: Product not found, details: null }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: password
                  message: Password must contain at least one number
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: UNAUTHORIZED, message: Authentication required, details: null }
    Forbidden:
      description: Logged in, but missing the required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: FORBIDDEN, message: You do not have permission for this action, details: null }

  schemas:
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: At least 8 characters, with at least one letter and one number.
      example: Password123

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        phone: { type: string, example: '+2348012345678' }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
      example:
        refreshToken: 5e0c...b7f2

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        roles:
          type: array
          items: { type: string, enum: [BUYER, VENDOR, ADMIN] }
        isEmailVerified: { type: boolean }
        status: { type: string, enum: [ACTIVE, FROZEN] }
        walletStatus: { type: string, enum: [PENDING, CREATED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }

    TokenResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            accessToken: { type: string, description: 'JWT, valid for 15 minutes' }
            refreshToken: { type: string, description: 'Opaque token, valid for 7 days, single use' }
            tokenType: { type: string, example: Bearer }
            expiresIn: { type: string, example: 15m }
      example:
        success: true
        data:
          accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          refreshToken: 5e0c...b7f2
          tokenType: Bearer
          expiresIn: 15m

    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true, description: Send back as ?cursor= for the next page }
        hasMore: { type: boolean }
        limit: { type: integer }
      example:
        nextCursor: eyJzb3J0VmFsdWUiOjE1MDAwMDAsIl9pZCI6IjY3NGExZjBjMmI5ZTRjMDAxMmFiMzRjZCJ9
        hasMore: true
        limit: 20

    BankDetails:
      type: object
      required: [bankName, bankCode, accountNumber, accountName]
      properties:
        bankName: { type: string }
        bankCode: { type: string, pattern: '^\d{3,6}$' }
        accountNumber: { type: string, description: '10 digits. Responses show only the last 4, e.g. ******6789' }
        accountName: { type: string }

    VendorApplyRequest:
      type: object
      additionalProperties: false
      required: [storeName, bankDetails]
      properties:
        storeName: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        bankDetails: { $ref: '#/components/schemas/BankDetails' }

    VendorApplication:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        storeName: { type: string }
        storeSlug: { type: string }
        description: { type: string }
        bankDetails: { $ref: '#/components/schemas/BankDetails' }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VendorApplicationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            application: { $ref: '#/components/schemas/VendorApplication' }

    PublicVendor:
      type: object
      properties:
        vendorId: { type: string }
        storeName: { type: string }
        storeSlug: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    Variant:
      type: object
      required: [name, sku, priceKobo, stock]
      properties:
        _id: { type: string, description: 'Send the existing _id on update to keep the variant (carts point at it)' }
        name: { type: string }
        sku: { type: string }
        attributes:
          type: object
          properties:
            size: { type: string }
            colour: { type: string }
        priceKobo: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }

    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [name, priceKobo, category, stock]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        priceKobo: { type: integer, minimum: 1, maximum: 10000000000, description: Whole kobo }
        category: { type: string, description: Stored in lowercase }
        images: { type: array, maxItems: 10, items: { type: string, format: uri } }
        stock: { type: integer, minimum: 0 }
        variants: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Variant' } }
        tags: { type: array, maxItems: 20, items: { type: string } }

    ProductUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        description: { type: string }
        priceKobo: { type: integer, minimum: 1 }
        category: { type: string }
        images: { type: array, items: { type: string, format: uri } }
        stock: { type: integer, minimum: 0 }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        tags: { type: array, items: { type: string } }
        isActive: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string, description: "The vendor's user id" }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        priceKobo: { type: integer }
        category: { type: string }
        images: { type: array, items: { type: string } }
        stock: { type: integer }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        tags: { type: array, items: { type: string } }
        isActive: { type: boolean }
        ratingAvg: { type: number, example: 4.33 }
        ratingCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            product: { $ref: '#/components/schemas/Product' }

    Review:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        buyerId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id: { type: string, description: Use as itemId in PATCH/DELETE }
        productId: { type: string }
        variantId: { type: string, nullable: true }
        vendorId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        priceKoboSnapshot: { type: integer, description: Price when added (display only) }
        currentPriceKobo: { type: integer, nullable: true }
        currentStock: { type: integer }
        lineTotalKobo: { type: integer }
        priceChanged: { type: boolean }
        outOfStock: { type: boolean }
        unavailable: { type: boolean }
        addedAt: { type: string, format: date-time }

    CartResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
            subtotalKobo: { type: integer }
      example:
        success: true
        data:
          items:
            - id: 674a20aa2b9e4c0012ab3501
              productId: 674a1f0c2b9e4c0012ab34cd
              variantId: null
              vendorId: 674a1e992b9e4c0012ab34aa
              name: Red Sneakers
              quantity: 2
              priceKoboSnapshot: 250000
              currentPriceKobo: 300000
              currentStock: 5
              lineTotalKobo: 600000
              priceChanged: true
              outOfStock: false
              unavailable: false
              addedAt: '2026-11-21T10:00:00.000Z'
          subtotalKobo: 600000

    Wallet:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        currency: { type: string, example: NGN }
        balanceKobo: { type: integer, example: 250000 }
        status: { type: string, enum: [ACTIVE, FROZEN] }

    WalletEntry:
      type: object
      properties:
        id: { type: string, format: uuid, description: Ledger entry id }
        transactionId: { type: string, format: uuid }
        reference: { type: string, example: 'WALLET_FUNDING:FUND_3b8f0c1e-2a4d-4c55-9f1e-1c2d3e4f5a6b' }
        type: { type: string, example: WALLET_FUNDING }
        direction: { type: string, enum: [DEBIT, CREDIT], description: 'CREDIT adds to your balance, DEBIT takes from it' }
        amountKobo: { type: integer, example: 250000 }
        createdAt: { type: string, format: date-time }
        metadata: { type: object }

    FundingStarted:
      type: object
      properties:
        reference: { type: string, example: FUND_3b8f0c1e-2a4d-4c55-9f1e-1c2d3e4f5a6b }
        amountKobo: { type: integer, example: 250000 }
        authorizationUrl: { type: string, example: 'http://localhost:3000/mock-paystack/checkout/FUND_3b8f0c1e-2a4d-4c55-9f1e-1c2d3e4f5a6b' }
        status: { type: string, example: PENDING }

    Funding:
      type: object
      properties:
        reference: { type: string }
        amountKobo: { type: integer }
        currency: { type: string, example: NGN }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED] }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        variantId: { type: string, nullable: true }
        name: { type: string }
        unitPriceKobo: { type: integer, example: 100000 }
        quantity: { type: integer, example: 2 }
        lineTotalKobo: { type: integer, example: 200000 }

    SubOrderEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromStatus: { type: string, nullable: true, example: PAID }
        toStatus: { type: string, example: SHIPPED }
        actorId: { type: string, description: "A user id, or SYSTEM for background jobs" }
        actorRole: { type: string, enum: [BUYER, VENDOR, ADMIN, SYSTEM] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SubOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        vendorId: { type: string }
        buyerId: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, SHIPPED, DELIVERED, COMPLETED, CANCELLED, DISPUTED, REFUNDED] }
        subtotalKobo: { type: integer, example: 200000 }
        commissionRateBps: { type: integer, example: 500, description: Copied from settings at checkout }
        commissionKobo: { type: integer, nullable: true, description: Set when completed }
        trackingNumber: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true, example: BUYER_CANCELLED }
        shippedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        events:
          type: array
          description: Status history (on GET /orders/{orderId} and checkout)
          items: { $ref: '#/components/schemas/SubOrderEvent' }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyerId: { type: string }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, CANCELLED, REFUNDED] }
        totalKobo: { type: integer, example: 200000 }
        stockStatus: { type: string, enum: [PENDING, DEDUCTED, RELEASED] }
        cancelReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        subOrders: { type: array, items: { $ref: '#/components/schemas/SubOrder' } }

    OrderResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            order: { $ref: '#/components/schemas/Order' }

    Evidence:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [text, image] }
        value: { type: string, description: 'Text, or an http(s) image URL' }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        subOrderId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        buyerId: { type: string }
        vendorId: { type: string }
        subtotalKobo: { type: integer, example: 100000 }
        reason: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        status: { type: string, enum: [OPEN, RESOLVED] }
        resolution: { type: string, nullable: true, enum: [FULL_REFUND, PARTIAL_REFUND, REJECTED] }
        refundKobo: { type: integer, nullable: true, example: 40000 }
        resolvedBy: { type: string, nullable: true, description: Admin user id }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    DisputeResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            dispute: { $ref: '#/components/schemas/Dispute' }

    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendorId: { type: string }
        amountKobo: { type: integer, example: 300000 }
        status: { type: string, enum: [PENDING, PROCESSING, SUCCESS, FAILED] }
        bankSnapshot:
          type: object
          description: Bank details at request time (account number masked)
          properties:
            bankName: { type: string }
            bankCode: { type: string }
            accountName: { type: string }
            accountNumber: { type: string, example: '******6789' }
        attempts: { type: integer }
        providerReference: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }

    PayoutResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            payout: { $ref: '#/components/schemas/Payout' }

    PaystackEvent:
      type: object
      properties:
        event: { type: string, example: charge.success }
        data:
          type: object
          properties:
            reference: { type: string }
            amount: { type: integer, description: In kobo }
            currency: { type: string, example: NGN }
            status: { type: string, example: success }
            paid_at: { type: string, format: date-time }
            customer:
              type: object
              properties:
                email: { type: string }

    MessageResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            message: { type: string }

    DependencyCheck:
      type: object
      properties:
        status: { type: string, enum: [OK, DOWN] }
        latencyMs: { type: integer, nullable: true }

    HealthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            status: { type: string, enum: [OK, DEGRADED] }
            uptimeSeconds: { type: integer }
            checks:
              type: object
              properties:
                mongo: { $ref: '#/components/schemas/DependencyCheck' }
                postgres: { $ref: '#/components/schemas/DependencyCheck' }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { nullable: true }
